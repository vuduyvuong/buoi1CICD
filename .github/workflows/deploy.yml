name: CI/CD - Docker Build & Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          DOCKER_USER="${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}"
          docker build \
            -t $DOCKER_USER/react-ecommerce:latest \
            -t $DOCKER_USER/react-ecommerce:${{ github.sha }} .

      - name: Push Docker image
        run: |
          DOCKER_USER="${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}"
          docker push $DOCKER_USER/react-ecommerce:latest
          docker push $DOCKER_USER/react-ecommerce:${{ github.sha }}
